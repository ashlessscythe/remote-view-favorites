[mod-name]
remote-view-favorites=Remote View Favorites

[mod-description]
remote-view-favorites=Pin a surface as your default Remote View destination. Press TAB to open Remote View on your chosen surface instead of automatically opening on your character's current surface.

[mod-setting-name]
rvf-enable-default=Open Remote View on pinned surface
rvf-show-pin-ui=Show pin list in Remote View

[mod-setting-description]
rvf-enable-default=When enabled, Toggle map (default TAB) opens Remote View on your pinned surface instead of your character's current surface.
rvf-show-pin-ui=Show a small companion list of surfaces with pin buttons while you are in Remote View. The vanilla surface list cannot be modified by mods.

[controls]
rvf-toggle-map=Remote View Favorites (toggle map)

[rvf]
frame-caption=Default surface
pin-tooltip=Set as default Remote View surface
unpin-tooltip=Clear default Remote View surface
pinned=__1__ (default)
show-window=Show default surface list
hide-window=Hide default surface list
