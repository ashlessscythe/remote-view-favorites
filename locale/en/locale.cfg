[mod-name]
remote-view-favorites=Remote View Favorites

[mod-description]
remote-view-favorites=Pin a surface as your default Remote View destination. Press TAB to open Remote View on your chosen surface instead of automatically opening on your character's current surface. Assign numbered favorites (Alt+1–3 by default) to jump to a surface.

[mod-setting-name]
rvf-enable-default=Open Remote View on pinned surface
rvf-show-pin-ui=Show pin list in Remote View

[mod-setting-description]
rvf-enable-default=When enabled, Toggle map (default TAB) opens Remote View on your pinned surface instead of your character's current surface.
rvf-show-pin-ui=Show a small companion list of surfaces with pin buttons and favorite slots while you are in Remote View. The vanilla surface list cannot be modified by mods.

[controls]
rvf-toggle-map=Remote View Favorites (toggle map)
rvf-favorite-1=Favorite 1
rvf-favorite-2=Favorite 2
rvf-favorite-3=Favorite 3
rvf-favorite-4=Favorite 4
rvf-favorite-5=Favorite 5
rvf-favorite-6=Favorite 6
rvf-favorite-7=Favorite 7
rvf-favorite-8=Favorite 8
rvf-favorite-9=Favorite 9
rvf-favorite-10=Favorite 10 (0)

[controls-description]
rvf-favorite-1=Enter or switch Remote View to favorite slot 1. Default Alt+1.
rvf-favorite-2=Enter or switch Remote View to favorite slot 2. Default Alt+2.
rvf-favorite-3=Enter or switch Remote View to favorite slot 3. Default Alt+3.
rvf-favorite-4=Enter or switch Remote View to favorite slot 4. Unbound by default; assign a key here.
rvf-favorite-5=Enter or switch Remote View to favorite slot 5. Unbound by default; assign a key here.
rvf-favorite-6=Enter or switch Remote View to favorite slot 6. Unbound by default; assign a key here.
rvf-favorite-7=Enter or switch Remote View to favorite slot 7. Unbound by default; assign a key here.
rvf-favorite-8=Enter or switch Remote View to favorite slot 8. Unbound by default; assign a key here.
rvf-favorite-9=Enter or switch Remote View to favorite slot 9. Unbound by default; assign a key here.
rvf-favorite-10=Enter or switch Remote View to favorite slot 10 (shown as 0). Unbound by default; assign a key here.

